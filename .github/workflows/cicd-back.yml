name: cicd-back

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app/backend/**]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --omit=dev
      - run: zip -qr lambda.zip src quizzes package.json node_modules -x src/dev.js
      - run: aws lambda update-function-code --function-name lambda-quiz-lab --zip-file fileb://lambda.zip
